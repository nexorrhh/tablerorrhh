<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Autorización de permisos para responsables de área — Cimomet S.A. / Co.mo.ing S.R.L.">
  <meta name="robots" content="noindex">
  <title>Autorización de permisos</title>

  <!-- Mismo anti-flash de tema que el Tablero (clave 'rrhh_tema' en localStorage). -->
  <script>
    (function () {
      var guardado = null;
      try { guardado = localStorage.getItem('rrhh_tema'); } catch (e) {}
      var oscuro = guardado ? guardado === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
    })();
  </script>

  <link rel="stylesheet" href="../estilos/base.css">
  <!-- Por las ventanas emergentes (sol__modal) y su animación de apertura "en línea". -->
  <link rel="stylesheet" href="../estilos/componentes.css">
  <style>
    body { display: flex; justify-content: center; padding: var(--espacio-xl) var(--espacio-m); }
    .aut-shell { width: 100%; max-width: 720px; }
    .aut-cargando, .aut-vacio { color: var(--color-texto-sec); font-size: 0.95rem; text-align: center; padding: var(--espacio-xl) 0; }
    .aut-error {
      background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: var(--radio-m);
      padding: var(--espacio-xl) var(--espacio-l); text-align: center; color: var(--color-texto);
    }
    .aut-error h1 { font-size: 1.15rem; margin-bottom: 8px; }
    .aut-error p { color: var(--color-texto-sec); font-size: 0.9rem; }

    .aut-top { margin-bottom: var(--espacio-l); }
    .aut-marca { font-size: 0.75rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--color-texto-sec); }
    .aut-titulo { font-size: 1.6rem; font-weight: 700; margin: 2px 0 4px; }
    .aut-sub { color: var(--color-texto-sec); font-size: 0.9rem; }

    .aut-aviso {
      border: 1px solid var(--color-borde); border-left: 4px solid #d97706; border-radius: var(--radio-s);
      background: var(--color-fondo-tarjeta); padding: 10px 14px; font-size: 0.85rem; margin-bottom: var(--espacio-m);
    }
    .aut-aviso--ok { border-left-color: #16a34a; }

    .aut-lista { display: flex; flex-direction: column; gap: 10px; }
    .aut-fila {
      width: 100%; text-align: left; font: inherit; color: var(--color-texto); cursor: pointer;
      background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: var(--radio-s);
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
      transition: border-color .18s ease, transform .18s ease, box-shadow .18s ease;
    }
    .aut-fila:hover { border-color: var(--color-primario); transform: translateY(-1px); box-shadow: 0 6px 16px rgba(21,71,110,.08); }
    .aut-fila:focus-visible { outline: 2px solid var(--color-primario); outline-offset: 2px; }
    .aut-fila-nombre { font-weight: 600; display: block; }
    .aut-fila-meta { color: var(--color-texto-sec); font-size: 0.82rem; }
    .aut-fila-ver { color: var(--color-primario); font-weight: 600; font-size: 0.85rem; white-space: nowrap; }
    .aut-tipo {
      display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.72rem; font-weight: 700;
      background: var(--color-fondo); border: 1px solid var(--color-borde); color: var(--color-texto);
    }

    .aut-modal { max-width: 480px; }
    .aut-detalle { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0; font-size: 0.9rem; }
    .aut-detalle dt { color: var(--color-texto-sec); font-weight: 600; }
    .aut-detalle dd { margin: 0; color: var(--color-texto); overflow-wrap: anywhere; }
    .aut-hist { border-top: 1px solid var(--color-borde); padding-top: var(--espacio-s); }
    .aut-hist-tit { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; color: var(--color-texto-sec); margin: 0 0 6px; }
    .aut-hist-vacio { color: var(--color-texto-sec); font-size: 0.85rem; margin: 0; }
    .aut-hist-resumen { font-size: 0.85rem; color: var(--color-texto); margin: 0 0 8px; }
    .aut-hist-lista { list-style: none; margin: 0; padding: 0; max-height: 220px; overflow-y: auto; border: 1px solid var(--color-borde); border-radius: var(--radio-s); }
    .aut-hist-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; font-size: 0.82rem; }
    .aut-hist-item + .aut-hist-item { border-top: 1px solid var(--color-borde); }
    .aut-hist-fecha { color: var(--color-texto-sec); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .aut-hist-info { min-width: 0; display: flex; flex-direction: column; }
    .aut-hist-tipo { font-weight: 600; color: var(--color-texto); }
    .aut-hist-motivo { color: var(--color-texto-sec); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .aut-est { padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; white-space: nowrap; background: var(--color-fondo); color: var(--color-texto-sec); }
    .aut-est--ok   { background: #dcfce7; color: #166534; }
    .aut-est--no   { background: #fee2e2; color: #991b1b; }
    .aut-est--pend { background: #fef3c7; color: #92400e; }
    .aut-acciones { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
    .aut-btn {
      padding: 10px 18px; border-radius: var(--radio-s); font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      border: 1px solid var(--color-borde); background: var(--color-fondo); color: var(--color-texto);
      transition: background-color .18s ease, border-color .18s ease, color .18s ease;
    }
    .aut-btn:focus-visible { outline: 2px solid var(--color-primario); outline-offset: 2px; }
    .aut-btn:disabled { opacity: .6; cursor: default; }
    .aut-btn--ok { background: #16a34a; border-color: #16a34a; color: #fff; }
    .aut-btn--ok:hover:not(:disabled) { background: #15803d; }
    .aut-btn--no { color: #dc2626; border-color: #fca5a5; background: transparent; }
    .aut-btn--no:hover:not(:disabled) { background: #fef2f2; }
    .aut-msg-error { color: var(--color-error, #dc2626); font-size: 0.85rem; font-weight: 600; }
    .aut-resultado { text-align: center; padding: var(--espacio-m) 0; }
    .aut-resultado-icono { font-size: 2rem; }
    .aut-resultado-txt { font-weight: 700; font-size: 1.05rem; margin-top: 4px; }
  </style>
</head>
<body>
  <main class="aut-shell" id="app"><p class="aut-cargando">Cargando…</p></main>
  <script type="module" src="./autorizaciones.js"></script>
</body>
</html>
