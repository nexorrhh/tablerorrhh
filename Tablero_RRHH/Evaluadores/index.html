<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Portal de evaluadores — Evaluación de desempeño, Cimomet S.A. / Co.mo.ing S.R.L.">
  <title>Evaluaciones — Cimomet</title>

  <!-- Mismo anti-flash de tema que index.html del Tablero de RRHH, misma clave 'rrhh_tema' en
       localStorage — así respeta la preferencia clara/oscura que ya tenga guardada el navegador. -->
  <script>
    (function () {
      var guardado = localStorage.getItem('rrhh_tema');
      var oscuro = guardado ? guardado === 'oscuro' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.tema = oscuro ? 'oscuro' : 'claro';
    })();
  </script>

  <link rel="stylesheet" href="../estilos/base.css">
  <style>
    body { display: flex; justify-content: center; padding: var(--espacio-xl) var(--espacio-m); }

    /* ── Login ──────────────────────────────────────────────────────────── */
    .ev-cargando, .ev-vacio { color: var(--color-texto-sec); font-size: 0.95rem; text-align: center; padding: var(--espacio-xl) 0; }
    .ev-card {
      width: 100%; max-width: 420px; background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde);
      border-radius: var(--radio-m); box-shadow: var(--sombra-m); padding: var(--espacio-xl) var(--espacio-l); text-align: center;
    }
    .ev-card--chica { max-width: 360px; }
    .ev-marca { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
    .ev-sub { color: var(--color-texto-sec); font-size: 0.9rem; margin-bottom: var(--espacio-m); }
    .ev-perfiles { display: flex; flex-direction: column; gap: 8px; margin-top: var(--espacio-m); }
    .ev-perfil {
      display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--color-borde);
      border-radius: var(--radio-s); background: var(--color-fondo); cursor: pointer; font-size: 0.95rem; color: var(--color-texto);
      text-align: left;
    }
    .ev-perfil:hover { border-color: var(--color-primario); }
    .ev-avatar {
      flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--color-primario-claro); color: var(--color-primario);
      display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.8rem;
    }
    .ev-avatar--lg { width: 56px; height: 56px; font-size: 1.1rem; margin: 0 auto 8px; }
    .ev-nombre-grande { font-size: 1.1rem; margin-bottom: 4px; }
    .ev-input {
      width: 100%; padding: 10px 12px; border: 1px solid var(--color-borde); border-radius: var(--radio-s);
      background: var(--color-fondo-tarjeta); color: var(--color-texto); font-size: 1rem; text-align: center; margin-top: 4px;
    }
    .ev-input:focus-visible { outline: 2px solid var(--color-primario); outline-offset: 1px; }
    .ev-error { color: var(--color-error); font-size: 0.85rem; margin-top: 8px; }
    .ev-footer { display: flex; gap: 8px; margin-top: var(--espacio-m); }
    .ev-btn-sec, .ev-btn-pri {
      flex: 1; padding: 10px 14px; border-radius: var(--radio-s); font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none;
    }
    .ev-btn-sec { background: var(--color-fondo); color: var(--color-texto-sec); border: 1px solid var(--color-borde); flex: none; }
    .ev-btn-pri { background: var(--color-primario); color: #fff; }
    .ev-btn-pri:disabled, .ev-btn-sec:disabled { opacity: 0.6; cursor: default; }

    /* ── Panel ──────────────────────────────────────────────────────────── */
    .ev-shell { width: 100%; max-width: 720px; }
    .ev-topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--espacio-l); gap: var(--espacio-m); flex-wrap: wrap; }
    .ev-topbar-marca { font-weight: 700; font-size: 1.1rem; }
    .ev-topbar-sub { color: var(--color-texto-sec); font-size: 0.85rem; }
    .ev-lede { color: var(--color-texto-sec); font-size: 0.9rem; margin-bottom: var(--espacio-m); }
    .ev-lista { display: flex; flex-direction: column; gap: 10px; }
    .ev-fila {
      background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: var(--radio-s);
      padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
    }
    .ev-fila-nombre { font-weight: 600; display: block; }
    .ev-fila-meta { color: var(--color-texto-sec); font-size: 0.8rem; }
    .ev-fila-chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .ev-chip {
      border: 1px solid var(--color-borde); border-radius: 999px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600;
      background: var(--color-fondo); cursor: default;
    }
    button.ev-chip { cursor: pointer; }
    .ev-chip--pend { color: #d97706; border-color: #d97706; }
    .ev-chip--ok { color: #16a34a; border-color: #16a34a; }

    .ev-form-card { background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: var(--radio-m); padding: var(--espacio-l); margin-top: var(--espacio-m); }
    .ev-form-tit { font-size: 1.15rem; margin-bottom: 2px; }
    .ev-form-sub { color: var(--color-texto-sec); font-size: 0.85rem; margin-bottom: var(--espacio-m); }
    .ev-kpis { display: flex; gap: var(--espacio-m); margin-bottom: var(--espacio-m); flex-wrap: wrap; }
    .ev-kpi { flex: 1; min-width: 140px; border: 1px solid var(--color-borde); border-radius: var(--radio-s); padding: 12px 14px; }
    .ev-kpi-num { display: block; font-size: 1.3rem; font-weight: 700; }
    .ev-kpi-lbl { color: var(--color-texto-sec); font-size: 0.78rem; }
    .ev-campos { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: var(--espacio-m); }
    .ev-campo { display: flex; flex-direction: column; gap: 6px; font-size: 0.8rem; font-weight: 600; color: var(--color-texto-sec); }
    .ev-campo--full { grid-column: 1 / -1; }
    .ev-textarea {
      padding: 8px 10px; border: 1px solid var(--color-borde); border-radius: var(--radio-s); background: var(--color-fondo-tarjeta);
      color: var(--color-texto); font-family: inherit; font-size: 0.85rem; resize: vertical;
    }
    .ev-preview, #ev-preview { margin-top: var(--espacio-m); }
    .ev-resultado { display: inline-flex; align-items: baseline; gap: 10px; border: 2px solid; border-radius: var(--radio-s); padding: 10px 18px; }
    .ev-resultado-num { font-size: 1.6rem; font-weight: 700; }
    .ev-resultado-lbl { font-weight: 600; }
    .ev-vacio-small { color: var(--color-texto-sec); font-size: 0.82rem; }
    .ev-acciones { margin-top: var(--espacio-m); }
    .ev-acciones .ev-btn-pri { flex: none; padding: 10px 20px; }
    .ev-msg-exito { color: #16a34a; font-size: 0.85rem; margin-top: 8px; font-weight: 600; }
    .ev-msg-error { color: var(--color-error); font-size: 0.85rem; margin-top: 8px; font-weight: 600; }

    /* Desplegable con fade (components/selector-escala.js) — copiado de estilos/componentes.css,
       reutiliza los mismos tokens de base.css que ya importamos arriba. */
    .escala-select--oculto { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .escala-desc { position: relative; width: 100%; }
    .escala-desc__trigger { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border: 1px solid var(--color-borde); border-radius: var(--radio-s); background: var(--color-fondo-tarjeta); color: var(--color-texto); font: inherit; font-size: 0.9rem; text-align: left; cursor: pointer; }
    .escala-desc__trigger::after { content: ''; flex: none; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid var(--color-texto-sec); transition: transform 0.15s ease; }
    .escala-desc__trigger[aria-expanded="true"]::after { transform: rotate(180deg); }
    .escala-desc__trigger:focus-visible { outline: 2px solid var(--color-primario); outline-offset: 1px; }
    .escala-desc__trigger--vacio { color: var(--color-texto-muted); }
    .escala-desc__lista { position: absolute; z-index: 60; top: calc(100% + 4px); left: 0; right: 0; background: var(--color-fondo-tarjeta); border: 1px solid var(--color-borde); border-radius: var(--radio-s); box-shadow: 0 8px 24px rgba(0,0,0,0.14); padding: 4px; opacity: 0; transform: translateY(-6px); transition: opacity 0.15s ease, transform 0.15s ease; }
    .escala-desc__lista--abierta { opacity: 1; transform: translateY(0); }
    .escala-desc__opcion { padding: 8px 10px; border-radius: calc(var(--radio-s) - 2px); font-size: 0.9rem; color: var(--color-texto); cursor: pointer; }
    .escala-desc__opcion:hover, .escala-desc__opcion[aria-selected="true"] { background: var(--color-primario); color: #fff; }
    @media (prefers-reduced-motion: reduce) {
      .escala-desc__lista { transition: none; }
      .escala-desc__trigger::after { transition: none; }
    }
  </style>
</head>
<body>
  <div id="app"><p class="ev-cargando">Cargando…</p></div>

  <script type="module">
    import { obtenerEvaluadorActivo } from './evaluador-sesion.js';
    import { mostrarLoginEvaluador } from './evaluador-login.js';
    import { renderizarPanelEvaluador } from './evaluador-panel.js';

    const app = document.getElementById('app');
    let evaluador = obtenerEvaluadorActivo();
    if (!evaluador) {
      evaluador = await mostrarLoginEvaluador(app);
    }
    await renderizarPanelEvaluador(app, evaluador);
  </script>
</body>
</html>
